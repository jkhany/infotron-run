<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Infotron Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet. HUD strip on top, the circuit board fills the rest; on touch screens the controls float over the board. */
:root{
  --ground:#000000;
  --panel:#141414;
  --line:#3a3a3a;
  --ink:#d9e4ea;
  --dim:#7d8e9a;
  --amber:#ffb23e;
  --murphy:#e5422c;
  --infotron:#d863f0;
  --display:"Silkscreen","Courier New",monospace;
  --body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
@supports (height:100dvh){ html,body{height:100dvh} }
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-inline:16px;padding-block:12px;max-width:1400px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--murphy);box-shadow:0 0 12px var(--murphy)}
.brand b{color:var(--infotron);font-weight:700}
.hud{display:flex;flex-wrap:wrap;gap:6px 22px;flex:1 1 auto}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.val{font-family:var(--display);color:#ffd23a;text-shadow:0 0 6px rgba(255,190,40,.45);font-size:18px;font-variant-numeric:tabular-nums;line-height:1}
.val.need{color:var(--infotron)}
.val.need.open{color:var(--amber)}
.val.flash{animation:flash .45s 2}
@keyframes flash{50%{color:#fff;text-shadow:0 0 10px var(--murphy)}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600;letter-spacing:.02em}
.btn:hover{border-color:#36444f}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1205}
.btn.chip{background:#0a0f13;padding:5px 10px;font-size:12px;font-weight:400}
.btn.chip.cur{border-color:var(--amber);color:var(--amber)}
.val.player{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.field{background:#0a0f13;border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--ink);font:inherit;font-size:16px;width:min(240px,100%);box-sizing:border-box}
.player{display:flex;flex-direction:column;gap:8px}
.top{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.top li{display:grid;grid-template-columns:2ch 1fr auto;gap:10px;font-size:13px;color:var(--dim)}
.top li.me{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#stage{position:relative;min-height:0;border:3px solid #6b6b6b;border-color:#9a9a9a #3e3e3e #3e3e3e #9a9a9a;border-radius:4px;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.toast{position:absolute;left:12px;right:12px;top:12px;margin-inline:auto;max-width:560px;box-sizing:border-box;background:rgba(10,14,18,.92);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;pointer-events:none;transition:opacity .6s;z-index:1}
.toast.gone{opacity:0}
.toast p{margin:0;line-height:1.45}
.toast .eyebrow{color:var(--amber)}
#overlay{position:absolute;inset:0;display:flex;padding:16px;background:rgba(4,6,9,.8);overflow:auto;z-index:2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:780px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;margin:auto}
.card.small{max-width:440px}
.logo{font-family:var(--display);font-size:clamp(30px,6vw,54px);margin:0;line-height:1;letter-spacing:.04em;font-weight:700;text-wrap:balance}
.logo span{color:var(--infotron)}
.lede{margin:0;color:var(--dim);max-width:62ch;line-height:1.5}
.sub{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--dim);margin:4px 0 0;font-weight:400;text-transform:uppercase}
.levels{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lvl{width:100%;text-align:left;background:#0a0f13;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.lvl .num{font-family:var(--display);font-size:22px;color:var(--amber);grid-row:span 2;align-self:center}
.lvl .nm{font-weight:600}
.lvl .meta{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.lvl:disabled{opacity:.4;cursor:not-allowed}
.lvl:not(:disabled):hover{border-color:var(--amber)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px}
.lg{display:flex;align-items:center;gap:10px;min-width:0}
.lg canvas{width:32px;height:32px;flex:none;border-radius:3px}
.lg div{display:flex;flex-direction:column;min-width:0}
.lg strong{font-size:13px;font-weight:600}
.lg span{font-size:12px;color:var(--dim)}
.keys{margin:0;font-size:12.5px;color:var(--dim);line-height:1.8}
kbd{font-family:var(--display);font-size:10.5px;border:1px solid #2c3742;border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink);background:#0a0f13}
.row{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.card h2{margin:0;font-family:var(--display);font-size:24px;line-height:1.1;font-weight:700;text-wrap:balance}
.card p{margin:0;line-height:1.5}
.help{margin:0;font-size:12.5px;color:var(--dim)}
/* ---------- Touch mode ----------
   JS adds html.touch when the game is played by touch (and drops it again if a keyboard takes over).
   The board fills the screen, the HUD shrinks to one line, and translucent controls float over the
   board's bottom corners. layout() keeps Murphy and the board's edges out from under them. */
#pad{display:none}
html.touch,html.touch body{overscroll-behavior:none}
html.touch #app{max-width:none;gap:6px;padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));grid-template-rows:auto minmax(0,1fr)}
html.touch .help,html.touch .brand,html.touch .actions .btn:not(#bMenu),html.touch .stat.sdisks,html.touch .stat.splayer{display:none}
html.touch .bar{flex-wrap:nowrap;gap:10px}
html.touch .hud{flex-wrap:nowrap;gap:16px;min-width:0}
html.touch .lbl{font-size:9px;letter-spacing:.12em}
html.touch .lbl .xl{display:none}
html.touch .val{font-size:15px}
html.touch .btn{touch-action:manipulation}
html.touch #bMenu{padding:8px 14px}
html.touch #stage{border-radius:6px;touch-action:none}
/* Murphy always starts at the top, so on touch screens the hint sits low, in the clear area just above the controls. */
html.touch .toast{top:auto;bottom:calc(var(--ib,0px) + 8px);left:calc(var(--il,0px) + 8px);right:calc(var(--ir,0px) + 8px);padding:8px 12px;font-size:13px}
html.touch #pad{display:block;position:absolute;inset:0;pointer-events:none;z-index:1;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  --stick:clamp(118px,32vmin,160px);--tb:clamp(56px,16vmin,70px)}
#overlay:not([hidden]) ~ #pad{visibility:hidden}
.stick{position:absolute;left:10px;bottom:10px;width:var(--stick);height:var(--stick);border-radius:50%;box-sizing:border-box;
  background:radial-gradient(circle,rgba(13,18,23,.2) 0 32%,rgba(13,18,23,.5) 72%);border:1px solid rgba(217,228,234,.18);
  pointer-events:auto;touch-action:none;opacity:.72;transition:opacity .15s}
.stick.on{opacity:1}
.stick b{position:absolute;font-size:15px;line-height:1;color:rgba(217,228,234,.6);transform:translate(-50%,-50%)}
.stick b[data-d="0"]{left:50%;top:15%}.stick b[data-d="1"]{left:85%;top:50%}.stick b[data-d="2"]{left:50%;top:85%}.stick b[data-d="3"]{left:15%;top:50%}
.stick b.on{color:var(--amber)}
.knob{position:absolute;left:50%;top:50%;width:38%;height:38%;border-radius:50%;transform:translate(-50%,-50%);
  background:rgba(217,228,234,.14);border:1px solid rgba(217,228,234,.25)}
.stick.on .knob{background:rgba(255,178,62,.22);border-color:rgba(255,178,62,.6)}
.btns{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:var(--tb) var(--tb);grid-template-rows:var(--tb) var(--tb);gap:8px;pointer-events:none}
.tb{pointer-events:auto;touch-action:none;width:var(--tb);height:var(--tb);border-radius:50%;position:relative;padding:0;
  background:rgba(13,18,23,.5);border:1px solid rgba(217,228,234,.2);color:var(--ink);font-family:var(--display);font-size:12px;letter-spacing:.05em;opacity:.78}
#tSnap{grid-column:1;grid-row:2}
#tDisk{grid-column:2;grid-row:1}
.tb.on{opacity:1;border-color:var(--amber);color:var(--amber);box-shadow:0 0 14px rgba(255,178,62,.35)}
#tDisk.empty{opacity:.35}
#tDisk[data-n]::after{content:attr(data-n);position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;
  border-radius:9px;background:var(--murphy);color:#fff;font:600 11px/18px var(--body);letter-spacing:0}
@media (max-width:640px){
  .brand{font-size:16px}
  .val{font-size:15px}
  .hud{gap:6px 14px}
  .actions .btn{padding:6px 9px}
}
@media (prefers-reduced-motion:reduce){ .val.flash{animation:none} .toast{transition:none} }
</style>
<div id="app">
  <header class="bar">
    <div class="brand"><i aria-hidden="true"></i>INFOTRON <b>RUN</b></div>
    <div class="hud">
      <div class="stat"><span class="lbl">Board</span><span class="val" id="hLevel">01</span></div>
      <div class="stat"><span class="lbl"><span class="xl">Infotrons </span>needed</span><span class="val need" id="hNeed">00</span></div>
      <div class="stat sdisks"><span class="lbl">Red disks</span><span class="val" id="hDisks">0</span></div>
      <div class="stat splayer"><span class="lbl">Player</span><span class="val player" id="hPlayer"></span></div>
      <div class="stat"><span class="lbl">Time</span><span class="val" id="hTime">0:00</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="bRestart" type="button">Restart</button>
      <button class="btn" id="bMenu" type="button">Boards</button>
      <button class="btn" id="bMusic" type="button">Music on</button>
      <button class="btn" id="bSound" type="button">Sound on</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv" aria-label="Game board"></canvas>
    <div class="toast gone" id="toast" aria-live="polite"></div>
    <div id="overlay" hidden></div>
    <div id="pad">
      <div class="stick" id="stick" role="group" aria-label="Move"><span class="knob" id="knob"></span><b data-d="0">&#9650;</b><b data-d="1">&#9654;</b><b data-d="2">&#9660;</b><b data-d="3">&#9664;</b></div>
      <div class="btns" id="btns">
        <button type="button" class="tb" id="tSnap" aria-label="Eat without moving">EAT</button>
        <button type="button" class="tb empty" id="tDisk" aria-label="Drop red disk">DISK</button>
      </div>
    </div>
  </main>
  <p class="help"><kbd>Arrows</kbd>/<kbd>WASD</kbd> move &middot; hold against a zonk to push &middot; <kbd>Space</kbd>+arrow eats without moving &middot; <kbd>X</kbd> drops a red disk &middot; <kbd>R</kbd> restart &middot; <kbd>Esc</kbd> boards &middot; <kbd>M</kbd> music &middot; <kbd>N</kbd> sound effects</p>
</div>
<script>
(() => {
'use strict';

/* ---------- Boards ----------
   #  hardware wall     =  RAM chip        .  base          (space) empty
   O  zonk              *  infotron        E  exit          @  Murphy
   S  snik snak         e  electron        o  orange disk   r  red disk
   Ports: ^ > v < one-way, | up/down, - left/right, + any way            */
const LEVELS = [
  {name:"Warm Boot", need:8,
   hint:"Dig through the green base and collect 8 infotrons to open the exit. Zonks fall once nothing holds them up, so don't stand underneath.",
   map:[
  '##############################',
  '#@..........O...........*....#',
  '#.....*.....=...=...O........#',
  '#...........=.*.=...........*#',
  '#.====.======...=====..=====.#',
  '#*......O.............O......#',
  '#.......=.......*.....=......#',
  '#..*....=....O..=.....=..*...#',
  '#.......=====...=======......#',
  '#....O........*.........E....#',
  '##############################',
  ]},
  {name:"Rolling Stock", need:10,
   hint:"Zonks and infotrons roll off anything round. Hold left or right against a zonk to push it into an empty space.",
   map:[

  '#....=====...O..=======..O...#',
  '#.........................O..#',
  '#..*..O....=.*.=....O....===.#',
  '#....===..==...==..===.......#',
  '#.....................*......#',
  '#OOO.....*..OOOO.......O.O...#',
  '#===..=======..=====..=====..#',
  '#*.......*...........*.......#',
  '#.....O.......O..O.......O...#',

   hint:"Snik snaks and electrons follow walls and explode on contact. Drop a zonk on them, or stay out of reach. Ports only let you through the way the arrows point.",
   map:[
  '################################',
  '#@.....O.O.O...........O.O.O...#',
  '#..............................#',
  '#..====.====.....*.....====.==.#',
  '#..=  S    =...........= S * =.#',
  '#..=   *   =....*......=     =.#',
  '#..=========...........=======.#',
  '#.*....O....... .......O....*..#',
  '#####v#########|########v#######',

  '#..=*..*=....=    *    =.......#',
  '#..======....=====.=====.......#',
  '#.........*....................#',
  '#.......=============..........#',
  '#.......=     e     =..........#',
  '#..*....=           =.....*....#',
  '#.......=============.......E..#',
  '#....*.........*.........*.....#',
  '################################',
  ]},
  {name:"Mainframe", need:15,
   hint:"The whole machine. Electrons burst into infotrons when something explodes them, so an orange disk dropped in the right place pays off.",
   map:[
  '########################################',
  '#@....OOOO....*......=......*....OOO...#',
  '#....====.....=.....=.....=.....====...#',
  '#..*.......*....=.....=.....*.......*..#',
  '#.======.=======.......=======.======..#',
  '#.=  S           ...           S   =...#',
  '#.=      *       ...    *          =...#',
  '#.==================================...#',
  '#......*.......O..........O.......*....#',
  '#..... ...O.......*.......O... ........#',
  '######+#######################+#########',
  '#..*.. ....*.........o........ .....*..#',

  '#..*..........=         e   =..........#',
  '#.............===============..........#',
  '#....*.....O.......*...........O...E...#',
  '########################################',

  /* Boards 6-10 are written in 10- or 12-character chunks so columns are easy to line up. '_' is also empty space. */

   hint:"Collect what you can up top before dropping through a one-way port. The two-way ports in the middle let you climb back. Electrons below burst into infotrons if an orange disk lands on them.",
   map:[

  '#.=____*__'+'_=..*.....'+'.....*..=_'+'_*_____=.#',

  '##########'+'##########'+'##########'+'##########',

  {name:"Bus Lines", need:30,
   hint:"Each bus is a lane patrolled by enemies, and the ports in and out never line up. Walk the lane to the next port and time your crossing. Ports marked with up and down arrows let you go back.",

  '#@...*....'+'..O...*...'+'...*...O..'+'...*.....#',
  '#.....*...'+'.*....O...'+'....*.....'+'.*...*_..#',
  '####v#####'+'##########'+'#####v####'+'######|###',
  '#______*__'+'_____S____'+'_*________'+'__*_____S#',
  '##########'+'##v#######'+'|#########'+'######|###',

  {name:"Overclock", need:20,
   hint:"Most infotrons are locked in RAM vaults. Dig out the base under an orange disk so it drops onto a vault roof and cracks it open. Save the red disks for the vault with no disk above it.",
   map:[
  '##########'+'##########'+'##########'+'##########',
  '#@.r....o.'+'....o.....'+'o....o....'+'..r.....*#',
  '#.........'+'..........'+'..........'+'.........#',
  '#..======.'+'...======.'+'...======.'+'...=====.#',
  '#..=*..*=.'+'...=*..*=.'+'...=*..*=.'+'...=*.*=.#',
  '#..=*..*=.'+'...=*..*=.'+'...=*..*=.'+'...=*.*=.#',
  '#..======.'+'...======.'+'...======.'+'...=====.#',
  '#.........'+'..........'+'..........'+'.........#',
  '#.________'+'__S_______'+'_______S__'+'________.#',

  '#...*.....'+'...o......'+'......o...'+'....*....#',
  '#.........'+'...=......'+'......=...'+'.........#',
  '#.O.O.O.O.'+'.*.*.*.*..'+'..*.*.*.*.'+'.O.O.O.O.#',
  '#.=.=.=.=.'+'=.=.=.=.=.'+'=.=.=.=.=.'+'=.=.=.=..#',

  '#..*......'+'....=====.'+'.=====....'+'..*......#',
  '#.....*...'+'....=_e_=.'+'.=_e_=....'+'......E..#',
  '##########'+'##########'+'##########'+'##########',

const SAVE_KEY='infotron-run-v1';
let save={unlocked:1,v:3,user:'Guest',players:[{name:'Guest',best:{}}]};
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&typeof s.unlocked==='number') save=s; }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }
// Migrate from TICK=120 to TICK=170: scale best times to keep wall-clock time the same
if(!(save.v>=2)){
  for(const k in save.best) save.best[k]=Math.round(save.best[k]*120/170);
  save.v=2; persist();
}
// Migrate to multi-player structure
if(save.v!==3){
  const legacy=save.best&&typeof save.best==='object'?save.best:{};
  if(!Array.isArray(save.players)||!save.players.length) save.players=[{name:'Guest',best:legacy}];
  save.user=save.players[0].name;
  delete save.best;
  save.v=3; persist();
}
const MAXNAME=12;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanName(s){ return String(s||'').replace(/[<>&"'`\\]/g,'').replace(/\s+/g,' ').trim().slice(0,MAXNAME); }
function findPlayer(n){ const k=n.toLowerCase(); return save.players.find(p=>p.name.toLowerCase()===k); }
function curPlayer(){ let p=findPlayer(save.user||''); if(!p){ p=save.players[0]||(save.players[0]={name:'Guest',best:{}}); save.user=p.name; } return p; }
function setPlayer(raw){ const n=cleanName(raw); if(!n) return false; let p=findPlayer(n); if(!p){ p={name:n,best:{}}; save.players.push(p); } save.user=p.name; persist(); updatePlayerHud(); return true; }
const bestOf=i=>curPlayer().best[i];
function boardTimes(i){ return save.players.filter(p=>p.best[i]).map(p=>({name:p.name,t:p.best[i]})).sort((a,b)=>a.t-b.t); }
function updatePlayerHud(){ const el=$('hPlayer'); if(el) el.textContent=curPlayer().name; }

/* ---------- Sound ---------- */
// Everything you hear is synthesised live with the Web Audio API; there are no audio files.
let ac=null, sfxBus=null, musBus=null, noiseBuf=null, lastBoom=0;
let soundOn=true, musicOn=true, wantSong=0;
try{
  soundOn=localStorage.getItem('infotron-run-sound')!=='off';
  musicOn=localStorage.getItem('infotron-run-music')!=='off';
}catch(e){}
function ensureAudio(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return; }
  if(!soundOn&&!musicOn) return;
  try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; return; }
  const master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
  sfxBus=ac.createGain(); sfxBus.connect(master);
  musBus=ac.createGain(); musBus.gain.value=.38; musBus.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const a=noiseBuf.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1;
  playMusic(wantSong);
}
document.addEventListener('visibilitychange',()=>{
  if(!ac) return;
  if(document.hidden) ac.suspend(); else ac.resume();
});

function tone(f,d,type,vol,f2,at,bus){
  const t=at||ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(bus||sfxBus); o.start(t); o.stop(t+d+.02);
}
function noise(d,vol,ftype,f1,f2,at,bus){
  const t=at||ac.currentTime, s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; f.type=ftype; f.frequency.setValueAtTime(f1,t);
  if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f); f.connect(g); g.connect(bus||sfxBus); s.start(t,Math.random()*.15); s.stop(t+d+.02);
}
// Short, chunky effects in the style of the original game's PC sounds.
function sfx(k){
  if(!ac||!soundOn) return;
  const t=ac.currentTime;
  switch(k){
    case 'eat':  noise(.05,.09,'bandpass',2600,900); break;
    case 'info': tone(988,.06,'square',.05,null,t); tone(1480,.12,'square',.045,null,t+.055); break;
    case 'pick': tone(523,.07,'square',.05,null,t); tone(784,.1,'square',.045,null,t+.06); break;
    case 'push': noise(.12,.1,'lowpass',700,200); tone(70,.1,'sawtooth',.03); break;
    case 'thud': tone(110,.12,'sine',.22,40); noise(.08,.12,'lowpass',900,120); break;
    case 'tick': tone(1600,.03,'triangle',.04); break;
    case 'port': tone(260,.14,'sine',.08,980); break;
    case 'arm':  tone(1200,.05,'square',.04,null,t); tone(1200,.05,'square',.04,null,t+.1); break;
    case 'open': [523,659,784,1047].forEach((f,i)=>tone(f,.13,'square',.045,null,t+i*.08)); break;
    case 'win':  [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i>4?.3:.14,'square',.05,null,t+i*.1)); break;
    case 'die':  tone(420,.7,'sawtooth',.05,45); break;
    case 'boom': {
      const n=performance.now(); if(n-lastBoom<70) return; lastBoom=n;
      noise(.8,.42,'lowpass',2400,90); tone(80,.5,'sine',.3,30);
    } break;
  }
}

const music={cur:-1, timer:0, step:0, next:0, bus:null};
function degOf(c){
  if(c>='1'&&c<='9') return c.charCodeAt(0)-49;
  if(c>='a'&&c<='g') return c.charCodeAt(0)-88;
  return c==='z'?-1:c==='y'?-2:-3;
}
function pitch(s,d){ const sc=SCALES[s.scale], o=Math.floor(d/7), i=((d%7)+7)%7; return s.root+12*o+sc[i]; }
function mnote(t,midi,dur,wave,vol,cut){
  const o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
  o.type=wave; o.frequency.setValueAtTime(440*Math.pow(2,(midi-69)/12),t);
  f.type='lowpass'; f.frequency.value=cut;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(vol*.45,t+Math.max(.02,Math.min(dur,.25)));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur+.08);
  o.connect(f); f.connect(g); g.connect(music.bus); o.start(t); o.stop(t+dur+.12);
}
function kick(t){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+.13);
  g.gain.setValueAtTime(.55,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
  o.connect(g); g.connect(music.bus); o.start(t); o.stop(t+.24);
}
function snare(t){ noise(.14,.22,'highpass',1300,null,t,music.bus); tone(190,.08,'triangle',.12,120,t,music.bus); }
function hat(t){ noise(.035,.07,'highpass',7500,null,t,music.bus); }

// Boards past the last written song replay an earlier board's tune, a fourth higher and a little faster.
function songFor(i){
  if(i<SONGS.length) return SONGS[i];
  const n=SONGS.length-1, s=SONGS[((i-1)%n)+1];
  return Object.assign({},s,{root:s.root+5,bpm:s.bpm+10});
}
function playMusic(i){
  wantSong=i;
  if(!ac||!musicOn) return;
  if(music.cur===i&&music.timer) return;
  stopMusic();
  music.cur=i; music.song=songFor(i); music.step=0; music.next=ac.currentTime+.1;
  music.bus=ac.createGain(); music.bus.connect(musBus);
  music.timer=setInterval(schedule,25); schedule();
}
function stopMusic(){
  if(music.timer){ clearInterval(music.timer); music.timer=0; }
  if(music.bus&&ac){
    const b=music.bus; b.gain.setTargetAtTime(.0001,ac.currentTime,.08);
    setTimeout(()=>b.disconnect(),700);
  }
  music.bus=null; music.cur=-1;
}
function schedule(){
  if(!ac||!music.bus) return;
  const s=music.song, spb=60/s.bpm/4;
  if(music.next<ac.currentTime) music.next=ac.currentTime+.02;   // after a pause, don't race to catch up
  while(music.next<ac.currentTime+.15){ playStep(s,music.step,music.next,spb); music.next+=spb; music.step++; }
}
function playStep(s,step,t,spb){
  const bar=Math.floor(step/16)%s.chords.length, st=step%16, cd=s.chords[bar];
  const tt=t+((st&1)&&s.swing?spb*s.swing:0);
  const L=s.lead[bar%s.lead.length], c=L[st];
  if(c!=='.'&&c!=='-'){
    let n=1; while(st+n<16&&L[st+n]==='-') n++;
    mnote(tt,pitch(s,degOf(c))+12*(s.lo||0),n*spb*.9,s.lw||'square',s.lv||.1,s.lc||2400);
  }
  const b=s.bass[st];
  if(b!=='.'){
    let mid=pitch(s,cd+(b==='f'?4:b==='t'?2:0))-12; if(b==='o') mid+=12;
    mnote(tt,mid,spb*1.5,'triangle',.22,900);
  }
  if(s.arp){ const a=s.arp[st]; if(a!=='.') mnote(tt,pitch(s,cd+2*(+a-1))+12,spb*.7,'square',.03,3000); }
  if(s.k&&s.k[st]==='x') kick(tt);
  if(s.s&&s.s[st]==='x') snare(tt);
  if(s.h&&s.h[st]==='x') hat(tt);
}

function toggleSound(){
  soundOn=!soundOn;
  try{ localStorage.setItem('infotron-run-sound',soundOn?'on':'off'); }catch(e){}
  if(soundOn) ensureAudio();
  $('bSound').textContent=soundOn?'Sound on':'Sound off';
}
function toggleMusic(){
  musicOn=!musicOn;
  try{ localStorage.setItem('infotron-run-music',musicOn?'on':'off'); }catch(e){}
  if(musicOn){ ensureAudio(); playMusic(wantSong); } else stopMusic();
  $('bMusic').textContent=musicOn?'Music on':'Music off';
}

/* ---------- Input ---------- */
const input={stack:[],tap:-1,snap:false,snapOnce:false,
  press(d){ if(!this.stack.includes(d)) this.stack.push(d); this.tap=d; },
  release(d){ this.stack=this.stack.filter(v=>v!==d); },
  take(){
    if(this.tap>=0){ const d=this.tap; this.tap=-1; return d; }
    return this.stack.length?this.stack[this.stack.length-1]:-1;
  },
  clear(){ this.stack=[]; this.tap=-1; this.snap=false; this.snapOnce=false; updatePadSnap(); }
};

function load(i){
  li=i;
  const rows=LEVELS[i].map;
  H=rows.length; W=Math.max(...rows.map(r=>r.length));
  grid=new Array(W*H).fill(null);
  m={x:1,y:1,fx:1,fy:1,mt:-1,alive:true,look:2,push:0,disks:0,snapT:-9,eat:null};
  parts=[]; rings=[]; flash=null;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    let ch=rows[y][x]||'#';
    if(x===0||y===0||x===W-1||y===H-1) ch='#';
    let c=null;
    switch(ch){
      case '#': { const h=(x*5+y*11+x*y)%9; c={t:WALL,v:h===0?3:h===1?2:h%2}; } break;
      case '=': c={t:RAM}; break;
      case '.': c={t:BASE,v:(x*7+y*13+(x*y)%5)%8}; break;
      case 'O': c={t:ZONK}; break;
      case '*': c={t:INFO}; break;
      case 'E': c={t:EXIT}; break;
      case 'S': c={t:SNIK,dir:3,hug:false}; break;
      case 'e': c={t:ELEC,dir:1,hug:false}; break;
      case 'P': c={t:PING,dir:1}; break;
      case 'p': c={t:PING,dir:0}; break;
      case 'H': c={t:HUNT,off:(x+y)&1}; break;
      case 'M': c={t:MINE,off:(x*3+y*5)&7}; break;
      case 'o': c={t:ODISK}; break;
      case 'r': c={t:RDISK}; break;
      case '@': m.x=m.fx=x; m.y=m.fy=y; break;
      default: if(PORTS[ch]) c={t:PORT,mask:PORTS[ch]};
    }
    if(c){ c.mt=-1; c.falling=false; }
    grid[y*W+x]=c;
  }
  need=LEVELS[i].need; got=0; tick=0; playTicks=0; acc=0; pending=[];
  deadTimer=0; exitOpen=false; dropReq=false; shake=0;
  input.clear(); camSnap=true;
  layout(); updateHud();
}

const get=(x,y)=>(x<0||y<0||x>=W||y>=H)?OOB:grid[y*W+x];
const isM=(x,y)=>m.alive&&m.x===x&&m.y===y;
const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!grid[y*W+x]&&!isM(x,y);
function move(x,y,nx,ny){
  const c=grid[y*W+x]; grid[ny*W+nx]=c; grid[y*W+x]=null;
  c.fx=x; c.fy=y; c.mt=tick;
}

/* ---------- Simulation ---------- */
function step(){
  tick++;
  const p=pending; pending=[];
  for(const e of p){
    const c=grid[e.y*W+e.x]; if(c&&c.t===EXPL&&e.info) c.info=true;
    explode(e.x,e.y,e.info);
  }
  if(state==='play'){ playTicks++; stepMurphy(); }
  stepWorld();
  if(state==='dead'&&--deadTimer<=0){ state='over'; showDead(); }
  updateHud();
}

function walk(x,y){ m.fx=m.x; m.fy=m.y; m.x=x; m.y=y; m.mt=tick; }

function collect(c,x,y,d,snap){
  m.eat={x,y,kind:c.t,v:c.v,dir:d,snap,tick};
  if(c.t===INFO){
    got++; sfx('info');
    burst(x,y,20,['#ffffff','#f59bff','#d863f0'],3.6,.06,0,520);
    ring(x,y,'216,99,240',.2,1.4,420);
    if(!exitOpen&&got>=need){
      exitOpen=true; sfx('open'); flash={c:'255,178,62',a:.35};
      grid.forEach((c,i)=>{ if(c&&c.t===EXIT){ ring(i%W,Math.floor(i/W),'255,178,62',.3,3,900); burst(i%W,Math.floor(i/W),24,['#fff3b0','#ffb23e'],3,.06,0,700); } });
    }
  }else if(c.t===RDISK){ m.disks++; sfx('pick'); burst(x,y,8,['#ffffff','#ff6a5e'],2.6,.06,0,400); }
  else { sfx('eat'); burst(x,y,5,['#5fd68a','#2f9150','#f2cd5e'],2.2,.065,9,380); }
}

function stepMurphy(){
  if(dropReq){
    dropReq=false;
    if(m.disks>0&&!grid[m.y*W+m.x]){
      grid[m.y*W+m.x]={t:RDISK_ON,timer:FUSE,mt:tick,falling:false};
      m.disks--; sfx('arm');
    }
  }
  const d=input.take();
  const push=m.push; m.push=0;
  if(d<0) return;
  const D=DIRS[d]; m.look=d;
  const nx=m.x+D.x, ny=m.y+D.y, c=get(nx,ny);

  if(input.snap||input.snapOnce){
    input.snapOnce=false; updatePadSnap();
    if(c&&(c.t===BASE||c.t===INFO||c.t===RDISK)){ collect(c,nx,ny,d,true); grid[ny*W+nx]=null; m.snapT=tick; }
    return;
  }
  if(!c){ walk(nx,ny); return; }
  switch(c.t){
    case BASE: case INFO: case RDISK:
      collect(c,nx,ny,d,false); grid[ny*W+nx]=null; walk(nx,ny); break;
    case EXIT:
      if(got>=need){ walk(nx,ny); win(); } else flashNeed();
      break;
    case ZONK: case ODISK:
      if(D.y===0&&!c.falling&&free(nx+D.x,ny)){
        m.push=push+1;
        if(m.push>=2){
          m.push=0;
          grid[ny*W+nx+D.x]=c; grid[ny*W+nx]=null; c.fx=nx; c.fy=ny; c.mt=tick;
          walk(nx,ny); sfx('push');
          burst(nx+D.x*.1,ny+.42,4,['#8a949d','#c3cbd2'],1.4,.05,3,320);
        }
      }
      break;
    case SNIK: case ELEC: case PING: case HUNT:
      walk(nx,ny); die(); break;
    case MINE:
      if(mineLive(c)){ walk(nx,ny); die(); }
      break;
    case PORT:
      if(((c.mask>>d)&1)&&free(nx+D.x,ny+D.y)){ walk(nx+D.x,ny+D.y); sfx('port'); }
      break;
  }
}

function stepWorld(){
  for(let y=H-2;y>=1;y--) for(let x=1;x<W-1;x++){
    const c=grid[y*W+x];
    if(!c||c.mt===tick) continue;
    switch(c.t){
      case ZONK: case INFO: case ODISK: stepFall(c,x,y); break;
      case SNIK: case ELEC: stepEnemy(c,x,y); break;
      case PING: stepPing(c,x,y); break;
      case HUNT: stepHunt(c,x,y); break;
      case MINE: stepMine(c,x,y); break;
      case RDISK_ON: if(--c.timer<=0) explode(x,y,false); break;
      case EXPL:
        if(--c.timer<=0) grid[y*W+x]=c.info?{t:INFO,mt:tick,falling:false}:null;
        break;
    }
  }
}

function stepFall(c,x,y){
  if(free(x,y+1)){ move(x,y,x,y+1); c.falling=true; return; }
  const b=get(x,y+1);
  if(c.falling){
    c.falling=false;
    if(isM(x,y+1)){ die(); return; }
    if(b&&ENEMY.has(b.t)){ explode(x,y+1,b.t===ELEC); return; }
    if(c.t===ODISK){ explode(x,y,false); return; }
    if(b&&b.t===ODISK){ explode(x,y+1,false); return; }
    sfx(c.t===ZONK?'thud':'tick');
    if(c.t===ZONK){ if(!reduceMotion) shake=Math.max(shake,2.5); }
    if(c.t===ZONK) burst(x,y+.42,8,['#8a949d','#c3cbd2','#5f6871'],1.6,.05,4,340);
  }
  if(!b||c.t===ODISK||!ROUND.has(b.t)||b.falling) return;
  if(free(x-1,y)&&free(x-1,y+1)){ move(x,y,x-1,y); return; }
  if(free(x+1,y)&&free(x+1,y+1)) move(x,y,x+1,y);
}

function stepPing(c,x,y){
  const F=DIRS[c.dir];
  if(isM(x+F.x,y+F.y)){ die(); return; }
  if(free(x+F.x,y+F.y)){ move(x,y,x+F.x,y+F.y); return; }
  c.dir=(c.dir+2)&3;
}

function stepHunt(c,x,y){
  if(((tick+c.off)&1)!==0) return;
  if(!m.alive) return;
  const dx=m.x-x, dy=m.y-y;
  if(Math.abs(dx)+Math.abs(dy)>9){ c.chase=false; return; }
  if(Math.abs(dx)+Math.abs(dy)===1){ die(); return; }
  const primaryHoriz=Math.abs(dx)>Math.abs(dy);
  const candidates=[];
  if(primaryHoriz){
    if(dx!==0) candidates.push({x:x+(dx>0?1:-1),y:y,dir:(dx>0?1:3)});
    if(dy!==0) candidates.push({x:x,y:y+(dy>0?1:-1),dir:(dy>0?2:0)});
  }else{
    if(dy!==0) candidates.push({x:x,y:y+(dy>0?1:-1),dir:(dy>0?2:0)});
    if(dx!==0) candidates.push({x:x+(dx>0?1:-1),y:y,dir:(dx>0?1:3)});
  }
  for(const cand of candidates){
    if(free(cand.x,cand.y)){
      move(x,y,cand.x,cand.y); c.dir=cand.dir; c.chase=true;
      return;
    }
  }
  c.chase=false;
}

const mineLive=c=>((tick+c.off)&7)>=5;
function stepMine(c,x,y){
  if(mineLive(c)&&m.alive&&Math.max(Math.abs(m.x-x),Math.abs(m.y-y))<=1){
    explode(x,y,false); return;
  }
}

// Snik snaks keep a wall on their left, electrons keep one on their right.
function stepEnemy(c,x,y){
  const h=c.t===SNIK?3:1;
  const sd=(c.dir+h)&3, S=DIRS[sd], F=DIRS[c.dir];
  if(isM(x+F.x,y+F.y)||isM(x+S.x,y+S.y)){ die(); return; }
  const sideFree=free(x+S.x,y+S.y);
  if(!sideFree) c.hug=true;
  if(c.hug&&sideFree){ c.dir=sd; move(x,y,x+S.x,y+S.y); return; }
  if(free(x+F.x,y+F.y)){ move(x,y,x+F.x,y+F.y); return; }
  c.dir=(c.dir+4-h)&3;
}

function explode(cx,cy,info){
  sfx('boom');
  if(!reduceMotion) shake=Math.max(shake,11);
  ring(cx,cy,info?'248,160,255':'255,214,90',.3,2.2,450);
  flash={c:'255,240,210',a:Math.max(flash?flash.a:0,.22)};
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const x=cx+dx, y=cy+dy;
    if(x<0||y<0||x>=W||y>=H) continue;
    const i=y*W+x, c=grid[i];
    if(c&&(c.t===WALL||c.t===EXIT||c.t===PORT||c.t===EXPL)) continue;
    if(c&&(dx||dy)&&(c.t===ODISK||c.t===RDISK||c.t===RDISK_ON||ENEMY.has(c.t)))
      pending.push({x,y,info:c.t===ELEC});
    grid[i]={t:EXPL,timer:EXPL_T,info:info,mt:tick,falling:false};
    burst(x,y,10,info?['#ffffff','#f59bff','#b44ae0']:['#fff3b0','#ffb23e','#ff6a1c','#c2381a'],4.2,.08,5,650);
    if(isM(x,y)) die();
  }
}

function die(){
  if(!m.alive) return;
  m.alive=false;
  if(state==='play') state='dead';
  deadTimer=11; sfx('die'); stopMusic();
  explode(m.x,m.y,false);
}

function win(){
  state='won'; sfx('win'); stopMusic();
  setTimeout(showWin,450);
}

/* ---------- HUD ---------- */
let flashAt=0;
function flashNeed(){
  const n=performance.now(); if(n-flashAt<900) return; flashAt=n;
  hNeed.classList.remove('flash'); void hNeed.offsetWidth; hNeed.classList.add('flash');
}
function updateHud(){
  const left=Math.max(0,need-got);
  hLevel.textContent=pad2(li+1);
  hNeed.textContent=left>0?pad2(left):'OPEN';
  hNeed.classList.toggle('open',left===0);
  const n=m?m.disks:0;
  hDisks.textContent=n;
  if(n>0) tDisk.dataset.n=n; else delete tDisk.dataset.n;
  tDisk.classList.toggle('empty',n===0);
  hTime.textContent=fmt(playTicks);
}

/* ---------- Sprites (drawn in a 0..1 unit square) ---------- */
function rr(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function rng(s){ return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function dot(g,x,y,r){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
function speckle(g,r,n,light,dark){
  for(let i=0;i<n;i++){ g.fillStyle=r()<.5?light:dark; const s=.012+r()*.025; g.fillRect(r(),r(),s,s); }
}
function bevel(g,w,hi,lo){
  g.fillStyle=hi; g.fillRect(0,0,1,w); g.fillRect(0,0,w,1);
  g.fillStyle=lo; g.fillRect(0,1-w,1,w); g.fillRect(1-w,0,w,1);
}
function screw(g,x,y,rad,a){
  const gr=g.createRadialGradient(x-rad*.35,y-rad*.35,0,x,y,rad);
  gr.addColorStop(0,'#f4f7f9'); gr.addColorStop(1,'#5a646e');
  g.fillStyle=gr; dot(g,x,y,rad);
  g.strokeStyle='#2b3239'; g.lineWidth=rad*.35;
  g.beginPath(); g.moveTo(x-Math.cos(a)*rad*.7,y-Math.sin(a)*rad*.7); g.lineTo(x+Math.cos(a)*rad*.7,y+Math.sin(a)*rad*.7); g.stroke();
}

// Empty floor: dark board with a faint grid and the odd dead trace.
function dBg(g,v){
  g.fillStyle='#000000'; g.fillRect(0,0,1,1);
  g.fillStyle='rgba(255,255,255,.025)'; g.fillRect(0,0,1,.02); g.fillRect(0,0,.02,1);
  g.fillStyle='#141414'; dot(g,.5,.5,.03);
  if(v===1){
    g.strokeStyle='#101010'; g.lineWidth=.05; g.lineCap='round';
    g.beginPath(); g.moveTo(0,.5); g.lineTo(.28,.5); g.lineTo(.42,.36); g.stroke();
    g.fillStyle='#181818'; dot(g,.44,.34,.045);
  }
}
function dShTop(g){
  const s=g.createLinearGradient(0,0,0,.38);
  s.addColorStop(0,'rgba(0,0,0,.6)'); s.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=s; g.fillRect(0,0,1,.38);
}
function dShLeft(g){
  const s=g.createLinearGradient(0,0,.3,0);
  s.addColorStop(0,'rgba(0,0,0,.45)'); s.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=s; g.fillRect(0,0,.3,1);
}

// Hardware: brushed steel plate, bevelled, screwed down. Variants: plain, plain, cross-braced, vented.
function dWall(g,v){
  v=v||0; const r=rng(v*131+7);
  const gr=g.createLinearGradient(0,0,1,1);
  gr.addColorStop(0,'#a2a2a2'); gr.addColorStop(1,'#5c5c5c');
  g.fillStyle=gr; g.fillRect(0,0,1,1);
  g.globalAlpha=.07;
  for(let i=0;i<16;i++){ g.fillStyle=r()<.5?'#fff':'#000'; g.fillRect(0,r(),1,.006+r()*.01); }
  g.globalAlpha=1;
  bevel(g,.06,'#d6d6d6','#2a2a2a');
  g.strokeStyle='rgba(18,23,28,.55)'; g.lineWidth=.025; g.strokeRect(.17,.17,.66,.66);
  g.strokeStyle='rgba(255,255,255,.2)'; g.lineWidth=.02; g.strokeRect(.185,.185,.66,.66);
  if(v===3){
    for(let i=0;i<3;i++){
      const y=.3+i*.15;
      rr(g,.27,y,.46,.07,.03); g.fillStyle='#1a1f25'; g.fill();
      g.fillStyle='rgba(255,255,255,.22)'; g.fillRect(.28,y+.068,.44,.012);
    }
  }else if(v===2){
    g.strokeStyle='rgba(30,36,42,.45)'; g.lineWidth=.04;
    g.beginPath(); g.moveTo(.22,.22); g.lineTo(.78,.78); g.moveTo(.78,.22); g.lineTo(.22,.78); g.stroke();
  }else{
    g.strokeStyle='rgba(30,36,42,.4)'; g.lineWidth=.03;
    g.beginPath(); g.moveTo(.22,.78); g.lineTo(.78,.22); g.stroke();
    g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=.015;
    g.beginPath(); g.moveTo(.23,.8); g.lineTo(.8,.23); g.stroke();
  }
  for(const [px,py] of [[.11,.11],[.89,.11],[.11,.89],[.89,.89]]) screw(g,px,py,.045,r()*Math.PI);
}

// RAM chip: glossy black package with gold legs.
function dRam(g){
  dBg(g);
  for(let i=0;i<4;i++){
    const x=.15+i*.2;
    const pg=g.createLinearGradient(x,0,x+.09,0);
    pg.addColorStop(0,'#fff2b8'); pg.addColorStop(.5,'#e8b947'); pg.addColorStop(1,'#946c1c');
    g.fillStyle=pg; g.fillRect(x,.06,.09,.18); g.fillRect(x,.76,.09,.18);
  }
  const bg=g.createLinearGradient(0,.2,0,.8);
  bg.addColorStop(0,'#3d4650'); bg.addColorStop(1,'#1a1f25');
  rr(g,.06,.2,.88,.6,.06); g.fillStyle=bg; g.fill();
  g.strokeStyle='#0c0f12'; g.lineWidth=.03; g.stroke();
  rr(g,.09,.23,.82,.15,.04); g.fillStyle='rgba(255,255,255,.1)'; g.fill();
  g.fillStyle='#12161a'; g.beginPath(); g.arc(.06,.5,.075,-Math.PI/2,Math.PI/2); g.fill();
  g.fillStyle='#6a7682'; dot(g,.19,.68,.03);
  g.fillStyle='#93a0ad'; g.fillRect(.3,.43,.44,.035);
  g.fillStyle='#6b7783'; g.fillRect(.3,.51,.3,.03); g.fillRect(.3,.58,.38,.03);
}

// Base: green fibreglass with copper traces, vias and the odd surface-mount part.
function dBase(g,v){
  const r=rng(v*977+13);
  const gr=g.createLinearGradient(0,0,1,1);
  gr.addColorStop(0,'#22a02c'); gr.addColorStop(1,'#13701c');
  g.fillStyle=gr; g.fillRect(0,0,1,1);
  g.globalAlpha=.09; g.strokeStyle='#0b3a1c'; g.lineWidth=.012;
  g.beginPath();
  for(let i=1;i<8;i++){ g.moveTo(i/8,0); g.lineTo(i/8,1); g.moveTo(0,i/8); g.lineTo(1,i/8); }
  g.stroke(); g.globalAlpha=1;
  speckle(g,r,26,'rgba(255,255,255,.1)','rgba(0,40,15,.18)');
  const traces=[];
  for(let k=0;k<2+(v%2);k++){
    const horiz=r()<.5, a=.15+r()*.7, b=.18+r()*.5, d=(r()<.5?-1:1)*.14;
    traces.push(horiz?[[0,a],[b,a],[b+.14,a+d],[1,a+d]]:[[a,0],[a,b],[a+d,b+.14],[a+d,1]]);
  }
  g.lineJoin='round'; g.lineCap='round';
  for(const [col,w] of [['rgba(8,45,22,.55)',.08],['#8cf06a',.042],['rgba(255,255,255,.35)',.012]]){
    g.strokeStyle=col; g.lineWidth=w;
    for(const t of traces){
      g.beginPath(); g.moveTo(t[0][0],t[0][1]);
      for(let i=1;i<t.length;i++) g.lineTo(t[i][0],t[i][1]);
      g.stroke();
    }
  }
  for(let k=0;k<2;k++){
    const x=.16+r()*.68, y=.16+r()*.68;
    const vg=g.createRadialGradient(x-.02,y-.02,0,x,y,.07);
    vg.addColorStop(0,'#fff3b0'); vg.addColorStop(1,'#c4932a');
    g.fillStyle=vg; dot(g,x,y,.065);
    g.fillStyle='#0f381e'; dot(g,x,y,.027);
  }
  if(v%3!==2){
    const vert=r()<.5, w=vert?.09:.22, h=vert?.22:.09, x=.18+r()*(.64-w), y=.18+r()*(.64-h);
    g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(x+.015,y+.02,w,h);
    g.fillStyle='#dde4e8'; g.fillRect(x,y,w,h);
    g.fillStyle=v%2?'#262b31':'#7a4a1c';
    if(vert) g.fillRect(x,y+.05,w,h-.1); else g.fillRect(x+.05,y,w-.1,h);
  }
  bevel(g,.035,'rgba(255,255,255,.18)','rgba(0,0,0,.3)');
}

// Zonk body (rotates when it rolls) and a fixed highlight drawn on top.
function dZonk(g){
  const gr=g.createRadialGradient(.36,.32,.03,.5,.5,.47);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(.35,'#d3dae0'); gr.addColorStop(.75,'#8a949d'); gr.addColorStop(1,'#4a535c');
  g.fillStyle=gr; dot(g,.5,.5,.43);
  g.save(); g.beginPath(); g.arc(.5,.5,.43,0,Math.PI*2); g.clip();
  g.strokeStyle='rgba(38,44,50,.55)'; g.lineWidth=.03;
  g.beginPath(); g.ellipse(.5,.5,.43,.16,-.5,0,Math.PI*2); g.stroke();
  g.beginPath(); g.ellipse(.5,.5,.16,.43,-.5,0,Math.PI*2); g.stroke();
  g.strokeStyle='rgba(255,255,255,.4)'; g.lineWidth=.014;
  g.beginPath(); g.ellipse(.49,.48,.43,.16,-.5,Math.PI,Math.PI*1.6); g.stroke();
  g.fillStyle='rgba(40,46,52,.5)'; dot(g,.66,.62,.03); dot(g,.34,.7,.022);
  g.restore();
}
function dZonkGloss(g){
  g.fillStyle='rgba(255,255,255,.75)';
  g.beginPath(); g.ellipse(.36,.3,.1,.055,-.6,0,Math.PI*2); g.fill();
  const sh=g.createRadialGradient(.38,.34,.2,.5,.5,.44);
  sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(10,14,18,.35)');
  g.fillStyle=sh; dot(g,.5,.5,.43);
  g.strokeStyle='rgba(18,22,26,.65)'; g.lineWidth=.025;
  g.beginPath(); g.arc(.5,.5,.43,0,Math.PI*2); g.stroke();
}

// Infotron: glowing core and orbit rings. The orbiting electrons are drawn live.

function drawMurphy(g,px,py,s,look,snap,o){
  o=o||{};
  const cx=px+s/2, cy=py+s/2, r=s*.42, D=DIRS[look];
  g.fillStyle='rgba(0,0,0,.35)';
  g.beginPath(); g.ellipse(cx+s*.05,py+s*.92,r*.85,r*.2,0,0,Math.PI*2); g.fill();
  g.save(); g.translate(cx,cy);
  if(o.lean) g.translate(D.x*s*.05,D.y*s*.05);
  const sq=o.squash||0;
  if(sq){ const a=1+.09*sq, b=1-.08*sq; if(D.x) g.scale(a,b); else g.scale(b,a); }
  const gr=g.createRadialGradient(-r*.35,-r*.4,r*.05,0,0,r);
  gr.addColorStop(0,'#ffb7a1'); gr.addColorStop(.35,'#f2553a'); gr.addColorStop(.8,'#b8230f'); gr.addColorStop(1,'#661005');
  g.fillStyle=gr; dot(g,0,0,r);
  g.strokeStyle='rgba(255,170,140,.35)'; g.lineWidth=s*.03;
  g.beginPath(); g.arc(0,0,r*.9,Math.PI*.1,Math.PI*.6); g.stroke();
  const ex=D.x*r*.16, ey=D.y*r*.12-r*.12, lid=o.blink?.12:1;
  for(const sx of [-1,1]){
    const x=sx*r*.34+ex, y=ey;
    g.fillStyle='#fff'; g.beginPath(); g.ellipse(x,y,r*.21,r*.27*lid,0,0,Math.PI*2); g.fill();
    g.strokeStyle='rgba(70,0,0,.55)'; g.lineWidth=Math.max(1,s*.015); g.stroke();
    if(lid===1){
      g.fillStyle='#15100f'; dot(g,x+D.x*r*.08,y+D.y*r*.1,r*.11);
      g.fillStyle='#fff'; dot(g,x+D.x*r*.08-r*.04,y+D.y*r*.1-r*.045,r*.035);
    }
  }
  const mx=ex*.5, my=r*.4;
  if(o.chomp){
    g.fillStyle='#3a0603';
    g.beginPath(); g.ellipse(mx,my,r*.2,r*(.03+.14*o.chomp),0,0,Math.PI*2); g.fill();
  }else{
    g.strokeStyle='#5a0d06'; g.lineWidth=Math.max(1,s*.035);
    g.beginPath(); g.arc(mx,my-r*.1,r*(snap?.24:.17),Math.PI*.15,Math.PI*.85); g.stroke();
  }
  g.fillStyle='rgba(255,255,255,.55)';
  g.beginPath(); g.ellipse(-r*.42,-r*.56,r*.16,r*.08,-.6,0,Math.PI*2); g.fill();
  g.restore();
}

function drawHunt(g,px,py,s,now,chase,dir){
  g.fillStyle='rgba(0,0,0,.3)';
  g.beginPath(); g.ellipse(px+s*.55,py+s*.9,s*.3,s*.07,0,0,Math.PI*2); g.fill();
  const cx=px+s/2, cy=py+s/2;
  g.save(); g.translate(cx,cy);

  // Violet body with radial gradient and outline
  const bodyGrad=g.createRadialGradient(0,0,0,0,0,s*.26);
  bodyGrad.addColorStop(0,'#b27cff');
  bodyGrad.addColorStop(.5,'#5a2a9c');
  bodyGrad.addColorStop(1,'#2a1050');
  g.fillStyle=bodyGrad; dot(g,0,0,s*.26);

  // Dark outline around body
  g.strokeStyle='#1a0835'; g.lineWidth=Math.max(1,s*.022);
  g.beginPath(); g.arc(0,0,s*.26,0,Math.PI*2); g.stroke();

  // White specular highlight on body
  g.fillStyle='rgba(255,255,255,.35)'; dot(g,-s*.08,-s*.08,s*.045);

  // 6 jointed legs with wiggle animation
  g.lineCap='round'; g.lineJoin='round';
  for(let i=0;i<6;i++){
    const baseAngle=Math.PI*2*i/6;
    const wiggle=Math.sin(now/110+i)*.35;
    const a1=baseAngle+wiggle;

    g.strokeStyle='#c9a6ff'; g.lineWidth=Math.max(1,s*.045);
    g.beginPath();

    // Leg segments radiating out with joints
    const sx1=Math.cos(a1)*s*.13, sy1=Math.sin(a1)*s*.13;
    const sx2=Math.cos(a1+wiggle*.5)*s*.24, sy2=Math.sin(a1+wiggle*.5)*s*.24;

    g.moveTo(sx1,sy1);
    g.lineTo(sx2,sy2);
    g.stroke();
  }

  // Large eye with sclera and iris
  g.fillStyle='#ffffff';
  const eyeDir=DIRS[dir];
  const eyeX=eyeDir.x*s*.04, eyeY=eyeDir.y*s*.04;
  dot(g,eyeX,eyeY,s*.11);

  // Iris and pupil
  if(chase){
    g.fillStyle='#ff2a1a'; dot(g,eyeX,eyeY,s*.065);
    g.fillStyle='#1a0000'; dot(g,eyeX,eyeY,s*.035);
    g.fillStyle='#ffffff'; dot(g,eyeX-s*.015,eyeY-s*.015,s*.012);
    // Faint red glow around body when chasing
    const chaseGlow=g.createRadialGradient(0,0,s*.2,0,0,s*.35);
    chaseGlow.addColorStop(0,'rgba(255,42,26,.15)');
    chaseGlow.addColorStop(1,'rgba(255,42,26,0)');
    g.fillStyle=chaseGlow; g.fillRect(-s*.35,-s*.35,s*.7,s*.7);
  }else{
    g.fillStyle='#ffb23e'; dot(g,eyeX,eyeY,s*.065);
    g.fillStyle='#8a6a1f'; dot(g,eyeX,eyeY,s*.035);
    // Half-closed upper lid when calm
    g.fillStyle='rgba(42,16,80,.5)';
    g.beginPath(); g.ellipse(eyeX,eyeY-s*.055,s*.068,s*.025,0,0,Math.PI); g.fill();
  }

  g.restore();
}
function drawMine(g,px,py,s,now,c){
  g.fillStyle='rgba(0,0,0,.3)';
  g.beginPath(); g.ellipse(px+s*.55,py+s*.9,s*.3,s*.07,0,0,Math.PI*2); g.fill();
  const cx=px+s/2, cy=py+s/2;
  const phase=((tick+c.off)&7);
  const live=mineLive(c), warn=phase===4;

  // Metal sphere body with radial gradient
  const sphereGrad=g.createRadialGradient(cx-s*.065,cy-s*.065,0,cx,cy,s*.24);
  sphereGrad.addColorStop(0,'#c9d3da');
  sphereGrad.addColorStop(.6,'#8a99a3');
  sphereGrad.addColorStop(1,'#3b454d');
  g.fillStyle=sphereGrad; dot(g,cx,cy,s*.24);

  // Dark outline around sphere
  g.strokeStyle='#1f252a'; g.lineWidth=Math.max(1,s*.02);
  g.beginPath(); g.arc(cx,cy,s*.24,0,Math.PI*2); g.stroke();

  // 8 metal spikes radiating from body
  for(let i=0;i<8;i++){
    const a=Math.PI*2*i/8;
    const bodyR=s*.24;
    const tipDist=s*.44;

    // Spike gradient from light to dark metal
    const sx=Math.cos(a), sy=Math.sin(a);
    const spikeGrad=g.createLinearGradient(
      cx+sx*bodyR,cy+sy*bodyR,
      cx+sx*tipDist,cy+sy*tipDist
    );
    spikeGrad.addColorStop(0,'#c9d3da');
    spikeGrad.addColorStop(.7,'#8a99a3');
    spikeGrad.addColorStop(1,'#5a6a74');

    // Draw spike as triangle
    const perpX=-sy*s*.055, perpY=sx*s*.055;
    g.fillStyle=spikeGrad;
    g.beginPath();
    g.moveTo(cx+sx*bodyR, cy+sy*bodyR);
    g.lineTo(cx+perpX, cy+perpY);
    g.lineTo(cx+sx*tipDist, cy+sy*tipDist);
    g.closePath();
    g.fill();

    // Dark outline on spike
    g.strokeStyle='#1f252a'; g.lineWidth=Math.max(1,s*.018);
    g.beginPath();
    g.moveTo(cx+sx*bodyR, cy+sy*bodyR);
    g.lineTo(cx+perpX, cy+perpY);
    g.lineTo(cx+sx*tipDist, cy+sy*tipDist);
    g.closePath();
    g.stroke();
  }

  // Specular highlight on sphere
  g.fillStyle='rgba(255,255,255,.4)'; dot(g,cx-s*.06,cy-s*.06,s*.038);

  // Centre lamp with state-dependent appearance
  let lampFlash=false;
  if(live){
    // Live mine: bright red with white-hot core
    if(warn) lampFlash=(Math.floor(now/90)%2===0);
    if(!warn || lampFlash){
      // Bright red glow around whole mine
      const liveGlow=g.createRadialGradient(cx,cy,0,cx,cy,s*.28);
      liveGlow.addColorStop(0,'rgba(255,42,26,.35)');
      liveGlow.addColorStop(.5,'rgba(255,42,26,.1)');
      liveGlow.addColorStop(1,'rgba(255,42,26,0)');
      g.fillStyle=liveGlow; g.fillRect(cx-s*.28,cy-s*.28,s*.56,s*.56);

      g.fillStyle='#ff2a1a'; dot(g,cx,cy,s*.095);
      g.fillStyle='#ffffff'; dot(g,cx,cy,s*.045);
    }else{
      // Flashing off state during warning
      g.fillStyle='#330000'; dot(g,cx,cy,s*.095);
    }
  }else if(warn){
    // Warning state: amber lamp flashing
    if(Math.floor(now/90)%2===0){
      g.fillStyle='#ffaa00'; dot(g,cx,cy,s*.095);
      g.fillStyle='#ff8800';
      g.strokeStyle='#aa6600'; g.lineWidth=Math.max(1,s*.015);
      g.beginPath(); g.arc(cx,cy,s*.105,0,Math.PI*2); g.stroke();
    }else{
      g.fillStyle='#553300'; dot(g,cx,cy,s*.095);
    }
  }else{
    // Dormant state: dim dark-red lamp with darker ring
    g.fillStyle='#550000'; dot(g,cx,cy,s*.095);
    g.fillStyle='#330000';
    g.strokeStyle='#220000'; g.lineWidth=Math.max(1,s*.015);
    g.beginPath(); g.arc(cx,cy,s*.105,0,Math.PI*2); g.stroke();
  }
}

    const a=Math.random()*Math.PI*2, v=spd*(.3+Math.random()*.7);
    parts.push({x:x+.5+(Math.random()-.5)*.4, y:y+.5+(Math.random()-.5)*.4,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v-(grav?spd*.35:0), g:grav, age:0,
      life:life*(.6+Math.random()*.4), c:colors[i%colors.length], s:size*(.6+Math.random()*.6)});
  }
  if(parts.length>700) parts.splice(0,parts.length-700);
}
// Expanding glow ring, radius in cells.
function ring(x,y,rgb,r0,r1,life){ if(!reduceMotion) rings.push({x:x+.5,y:y+.5,rgb,r0,r1,life,age:0}); }
function updParts(dt){
  const k=dt/1000;
  for(const r of rings) r.age+=dt; rings=rings.filter(r=>r.age<r.life);
  if(flash){ flash.a-=dt/400; if(flash.a<=0) flash=null; }
  for(const p of parts){ p.age+=dt; p.x+=p.vx*k; p.y+=p.vy*k; p.vy+=p.g*k; p.vx*=.97; }
  parts=parts.filter(p=>p.age<p.life);
}
function drawParts(ox,oy){
  for(const p of parts){
    ctx.globalAlpha=1-p.age/p.life; ctx.fillStyle=p.c;
    const sz=Math.max(1.5,p.s*T);
    ctx.fillRect(p.x*T+ox-sz/2,p.y*T+oy-sz/2,sz,sz);
  }
  ctx.globalAlpha=1;
  for(const r of rings){
    const t=r.age/r.life, rad=(r.r0+(r.r1-r.r0)*(1-(1-t)*(1-t)))*T;
    ctx.strokeStyle='rgba('+r.rgb+','+(1-t)*.8+')'; ctx.lineWidth=Math.max(2,T*.12*(1-t));
    ctx.beginPath(); ctx.arc(r.x*T+ox,r.y*T+oy,rad,0,Math.PI*2); ctx.stroke();
  }
  if(flash&&!reduceMotion){ ctx.fillStyle='rgba('+flash.c+','+flash.a+')'; ctx.fillRect(0,0,vw,vh); }
}

/* ---------- Rendering ---------- */
function layout(){
  const r=stage.getBoundingClientRect();
  vw=Math.max(1,r.width); vh=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  vig=document.createElement('canvas');
  vig.width=Math.max(1,Math.round(vw)); vig.height=Math.max(1,Math.round(vh));
  const vg=vig.getContext('2d');
  const gr=vg.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.35,vw/2,vh/2,Math.max(vw,vh)*.75);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.42)');
  vg.fillStyle=gr; vg.fillRect(0,0,vw,vh);
  padInsets();
  if(!W) return;
  const min=Math.min(vw,vh)<600?40:52;
  T=clamp(Math.floor(Math.min((vw-ins.l-ins.r)/W,(vh-ins.b)/H)),min,80);
  const key=T+'@'+dpr;
  if(key!==spriteKey){ spriteKey=key; buildSprites(); }
  camSnap=true;
}
// How much of the board the floating touch controls cover. Upright screens give up a strip along the
// bottom; wide screens give up the two sides instead, since height is what they are short of.
function padInsets(){
  ins={l:0,r:0,b:0};
  if(!touchMode) return;
  const s=stage.getBoundingClientRect(), a=stick.getBoundingClientRect(), b=btns.getBoundingClientRect();
  if(!a.width||!b.width) return;
  if(s.width>s.height*1.15){ ins.l=Math.max(0,a.right-s.left+4); ins.r=Math.max(0,s.right-b.left+4); }
  else ins.b=Math.max(0,s.bottom-Math.min(a.top,b.top)+4);
  stage.style.setProperty('--il',ins.l+'px'); stage.style.setProperty('--ir',ins.r+'px'); stage.style.setProperty('--ib',ins.b+'px');
}
function lerpPos(o,x,y,a){
  if(o.mt===tick&&o.fx!==undefined) return {x:o.fx+(x-o.fx)*a, y:o.fy+(y-o.fy)*a};
  return {x,y};
}
function blitRot(img,px,py,s,ang){
  ctx.save(); ctx.translate(px+s/2,py+s/2); ctx.rotate(ang);
  ctx.drawImage(img,-s/2,-s/2,s,s); ctx.restore();
}
// The tile Murphy is eating disappears from the side he enters, or shrinks away when snapped.
function drawEaten(alpha,ox,oy){
  const e=m.eat, px=e.x*T+ox, py=e.y*T+oy;
  if(e.kind===BASE&&!e.snap){
    const D=DIRS[e.dir], cut=alpha*T;
    let rx=px, ry=py, rw=T, rh=T;
    if(D.x>0){ rx+=cut; rw-=cut; } else if(D.x<0) rw-=cut;
    else if(D.y>0){ ry+=cut; rh-=cut; } else rh-=cut;
    if(rw<=0||rh<=0) return;
    ctx.save(); ctx.beginPath(); ctx.rect(rx,ry,rw,rh); ctx.clip();
    ctx.drawImage(spr.base[e.v],px,py,T,T); ctx.restore();
    return;
  }
  const img=e.kind===BASE?spr.base[e.v]:e.kind===INFO?spr.info:spr.rdisk, s=T*(1-alpha*.85);
  ctx.globalAlpha=1-alpha;
  ctx.drawImage(img,px+(T-s)/2,py+(T-s)/2,s,s);
  ctx.globalAlpha=1;
}
function render(alpha,now,dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000000'; ctx.fillRect(0,0,vw,vh);
  if(!grid||!spr) return;

  // Centre Murphy in the part of the stage the touch controls leave clear, and let the camera scroll
  // far enough that every edge of the board can be brought out from under them.
  const mp=lerpPos(m,m.x,m.y,alpha), ww=W*T, wh=H*T, rw=vw-ins.l-ins.r, rh=vh-ins.b;
  const tx=ww<=rw?(ww-rw)/2-ins.l:clamp(mp.x*T+T/2-ins.l-rw/2,-ins.l,ww-vw+ins.r);
  const ty=wh<=rh?(wh-rh)/2:clamp(mp.y*T+T/2-rh/2,0,wh-vh+ins.b);
  if(camSnap){ cam.x=tx; cam.y=ty; camSnap=false; }
  else { const k=1-Math.exp(-(dt||16)/110); cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k; }
  let ox=-cam.x, oy=-cam.y;
  if(shake>0){
    ox+=(Math.random()-.5)*shake; oy+=(Math.random()-.5)*shake;
    shake*=.86; if(shake<.4) shake=0;
  }
  ox=Math.round(ox); oy=Math.round(oy);
  const x0=Math.max(0,Math.floor(-ox/T)-1), x1=Math.min(W-1,Math.ceil((vw-ox)/T)+1);
  const y0=Math.max(0,Math.floor(-oy/T)-1), y1=Math.min(H-1,Math.ceil((vh-oy)/T)+1);

  // Pass 1: floor (with shadows cast by solid tiles above and to the left) and fixed tiles
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const c=grid[y*W+x], px=x*T+ox, py=y*T+oy;
    if(!c||DYN.has(c.t)){
      ctx.drawImage(spr.bg[(x*7+y*3)%5===0?1:0],px,py,T,T);
      const up=get(x,y-1), lf=get(x-1,y);
      if(up&&SOLID.has(up.t)) ctx.drawImage(spr.shTop,px,py,T,T);
      if(lf&&SOLID.has(lf.t)) ctx.drawImage(spr.shLeft,px,py,T,T);
      continue;
    }
    let img=spr.bg[0];
    switch(c.t){
      case WALL: img=spr.wall[c.v||0]; break;
      case RAM:  img=spr.ram; break;
      case BASE: img=spr.base[c.v]; break;
      case EXIT: img=exitOpen?spr.exit1:spr.exit0; break;
      case PORT: img=portSpr(c.mask); break;
    }
    ctx.drawImage(img,px,py,T,T);
    if(c.t===EXIT&&exitOpen){
      const a=.5+.5*Math.sin(now/170);
      ctx.fillStyle='rgba(255,236,170,'+(.12+.22*a)+')';
      ctx.fillRect(px+T*.14,py+T*.3,T*.72,T*.6);
      ctx.strokeStyle='rgba(255,178,62,'+(.35+.4*a)+')'; ctx.lineWidth=Math.max(2,T*.06);
      ctx.strokeRect(px+1,py+1,T-2,T-2);
    }
  }
  if(m.eat&&m.eat.tick===tick) drawEaten(alpha,ox,oy);

  // Pass 2: things that move
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const c=grid[y*W+x];
    if(!c||!DYN.has(c.t)) continue;
    const p=lerpPos(c,x,y,alpha), px=p.x*T+ox, py=p.y*T+oy;
    switch(c.t){
      case ZONK:
        shadow(px,py,T,.32);
        blitRot(spr.zonk,px,py,T,p.x*Math.PI/2);
        ctx.drawImage(spr.zonkGloss,px,py,T,T);
        break;
      case INFO: {
        const rot=p.x*Math.PI/2;
        blitRot(spr.info,px,py,T,rot);
        drawInfoElectrons(ctx,px,py,T,rot,now);
      } break;
      case ODISK: shadow(px,py,T,.34); ctx.drawImage(spr.odisk,px,py,T,T); break;
      case RDISK: shadow(px,py,T,.34); ctx.drawImage(spr.rdisk,px,py,T,T); break;
      case RDISK_ON:
        ctx.drawImage(spr.rdisk,px,py,T,T);
        if(Math.floor(now/(c.timer<12?70:180))%2){
          ctx.fillStyle='rgba(255,80,50,.35)'; ctx.fillRect(px+T*.1,py+T*.1,T*.8,T*.8);
          ctx.strokeStyle='#ff4a36'; ctx.lineWidth=Math.max(2,T*.07);
          ctx.strokeRect(px+T*.06,py+T*.06,T*.88,T*.88);
        }
        break;
      case SNIK: drawSnik(ctx,px,py,T,c.dir,now); break;
      case ELEC: drawElec(ctx,px,py,T,now); break;
      case PING: drawPing(ctx,px,py,T,c.dir,now); break;
      case HUNT: drawHunt(ctx,px,py,T,now,c.chase,c.dir||1); break;
      case MINE: drawMine(ctx,px,py,T,now,c); break;
      case EXPL: drawExpl(ctx,px,py,T,c,alpha); break;
    }
  }
  if(m.alive){
    const moving=m.mt===tick, eating=m.eat&&m.eat.tick===tick;
    drawMurphy(ctx,mp.x*T+ox,mp.y*T+oy,T,m.look,tick-m.snapT<2,{
      squash:moving?Math.sin(alpha*Math.PI):0,
      chomp:eating&&m.eat.kind===BASE?Math.sin(alpha*Math.PI):0,
      blink:(now%3400)<130,
      lean:m.push>0
    });
  }
  drawParts(ox,oy);
  if(vig) ctx.drawImage(vig,0,0,vw,vh);
}

/* ---------- Loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(250,now-last); last=now;
  const running=state==='play'||state==='dead'||state==='over';
  if(running){ acc+=dt; while(acc>=TICK){ acc-=TICK; step(); } }
  if(running||state==='won') updParts(dt);
  render(running?acc/TICK:1,now,dt);
  requestAnimationFrame(frame);
}

function drawIcon(c,k){
  const g=c.getContext('2d'), S=c.width;
  const unit=(fn,a)=>{ g.save(); g.scale(S,S); fn(g,a,S); g.restore(); };
  switch(k){
    case 'murphy': unit(dBg); drawMurphy(g,0,0,S,2,false); break;
    case 'base':   unit(dBase,1); break;
    case 'info':   unit(dBg); unit(dInfo); break;
    case 'zonk':   unit(dBg); unit(dZonk); unit(dZonkGloss); break;
    case 'ram':    unit(dRam); break;
    case 'wall':   unit(dWall); break;
    case 'exit':   unit(dExit,true); break;

    case 'hunt':   unit(dBg); drawHunt(g,0,0,S,600,true,1); break;
    case 'mine':   unit(dBg); drawMine(g,0,0,S,600,{off:0}); break;
    case 'odisk':  unit(dBg); unit(dDisk,'o'); break;

/* ---------- Events ---------- */
overlay.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  ensureAudio();
  if(b.dataset.player!==undefined){ setPlayer(b.dataset.player); showMenu(); return; }
  if(b.dataset.level!==undefined){ startLevel(+b.dataset.level); return; }
  switch(b.dataset.act){
    case 'resume': hideOverlay(); state='play'; playMusic(li+1); break;
    case 'retry':  startLevel(li); break;
    case 'next':   startLevel(li+1); break;
    case 'menu':   showMenu(); break;
    case 'music':  toggleMusic(); b.textContent=musicOn?'Music on':'Music off'; break;

  }
});

const KEYDIR={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  ensureAudio();
  // A real keyboard is in use (desktop, or a tablet with one attached): switch to the keyboard layout.
  if(!e.repeat&&(e.code in KEYDIR||e.code==='Space'||e.code==='KeyX')) setTouch(false);
  if(e.code==='KeyM'){ toggleMusic(); return; }
  if(e.code==='KeyN'){ toggleSound(); return; }
  if(!overlay.hidden){
    if(e.code==='Escape'&&state==='paused'){ e.preventDefault(); hideOverlay(); state='play'; playMusic(li+1); return; }
    if(e.code==='KeyR'){
      const r=overlay.querySelector('[data-act="retry"]');
      if(r){ e.preventDefault(); r.click(); }
      return;
    }
    const onButton=document.activeElement&&document.activeElement.tagName==='BUTTON';
    if(e.code==='Enter'&&!onButton){
      const p=overlay.querySelector('[data-primary]');
      if(p){ e.preventDefault(); p.click(); }
    }
    return;
  }
  if(e.code in KEYDIR){ e.preventDefault(); if(!e.repeat){ input.press(KEYDIR[e.code]); kickMove(); } return; }
  if(e.code==='Space'){ e.preventDefault(); input.snap=true; return; }
  if(e.code==='KeyX'){ e.preventDefault(); if(!e.repeat) dropReq=true; return; }
  if(e.code==='KeyR'){ e.preventDefault(); startLevel(li); return; }
  if(e.code==='Escape'){ e.preventDefault(); showMenu(); }
});
addEventListener('keyup',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(e.code in KEYDIR) input.release(KEYDIR[e.code]);
  if(e.code==='Space'){ input.snap=false; updatePadSnap(); }
});

function updatePadSnap(){ tSnap.classList.toggle('on',!!(input.snapOnce||input.snap)); }

// Switch between the keyboard layout and the touch layout (floating pad, one-line HUD, touch wording).
function setTouch(on){
  if(on===touchMode) return;
  touchMode=on;
  document.documentElement.classList.toggle('touch',on);
  $('bMenu').textContent=on?'Pause':'Boards';
  layout();
  if(m) showToast(true);
  if(!overlay.hidden&&overlay.querySelector('.levels')) showMenu();
}

// The stick is one touch zone: the direction comes from where the finger is relative to its centre,
// so sliding a thumb round it turns Murphy without lifting.
let stickId=null, stickDir=-1, turnTimer=null, wantDir=-1;
function setStickDir(d){
  if(d===stickDir) return;
  if(stickDir>=0) input.release(stickDir);
  stickDir=d;
  stick.querySelectorAll('b').forEach(b=>b.classList.toggle('on',+b.dataset.d===d));
  if(d>=0){
    input.press(d); kickMove();
    try{ if(navigator.vibrate) navigator.vibrate(6); }catch(err){}
  }
}
function stickAt(e){
  const r=stick.getBoundingClientRect(), dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const dist=Math.hypot(dx,dy);
  const ax=Math.abs(dx), ay=Math.abs(dy);
  const horiz=stickDir===1||stickDir===3;
  let want=-1;
  if(stickDir<0 ? dist>=r.width*.16 : dist>=r.width*.10){
    const useX=stickDir<0?(ax>ay):horiz?!(ay>ax*1.35):(ax>ay*1.35);
    want=useX?(dx>0?1:3):(dy>0?2:0);
  }
  if(want===-1 || stickDir<0 || want===stickDir){
    clearTimeout(turnTimer); turnTimer=null;
    setStickDir(want);
  }else if(want!==stickDir){
    wantDir=want;
    if(turnTimer===null){
      turnTimer=setTimeout(()=>{
        turnTimer=null;
        if(wantDir!==stickDir) setStickDir(wantDir);
      },70);
    }
  }
  const k=Math.min(1,dist/(r.width*.32)), a=Math.atan2(dy,dx), R=r.width*.22;
  knob.style.transform='translate(-50%,-50%) translate('+(Math.cos(a)*k*R).toFixed(1)+'px,'+(Math.sin(a)*k*R).toFixed(1)+'px)';
}
stick.addEventListener('pointerdown',e=>{
  e.preventDefault(); ensureAudio();
  if(stickId!==null) return;
  stickId=e.pointerId;
  try{ stick.setPointerCapture(e.pointerId); }catch(err){}
  stick.classList.add('on'); stickAt(e);
});
stick.addEventListener('pointermove',e=>{ if(e.pointerId===stickId) stickAt(e); });
const stickUp=e=>{
  if(e.pointerId!==stickId) return;
  clearTimeout(turnTimer); turnTimer=null;
  stickId=null; setStickDir(-1);
  stick.classList.remove('on'); knob.style.transform='';
  ensureAudio();   // phones only let audio start on a finger lift, not a touch-down
};
stick.addEventListener('pointerup',stickUp);
stick.addEventListener('pointercancel',stickUp);
stick.addEventListener('lostpointercapture',stickUp);

// EAT: tap to arm it for the next move, or hold it while steering to keep eating in place. Tap again to disarm.
tSnap.addEventListener('pointerdown',e=>{
  e.preventDefault(); ensureAudio();
  try{ tSnap.setPointerCapture(e.pointerId); }catch(err){}
  if(input.snapOnce) input.snapOnce=false;
  else { input.snapOnce=true; input.snap=true; }
  updatePadSnap();
});
const snapUp=()=>{ input.snap=false; updatePadSnap(); };
tSnap.addEventListener('pointerup',snapUp);
tSnap.addEventListener('pointercancel',snapUp);
tDisk.addEventListener('pointerdown',e=>{
  e.preventDefault(); ensureAudio(); dropReq=true;
  tDisk.classList.add('on'); setTimeout(()=>tDisk.classList.remove('on'),180);
});
// A long press on the controls must not open the browser's copy menu mid-run.
$('pad').addEventListener('contextmenu',e=>e.preventDefault());
// Tapping the board clears the hint so it doesn't cover the top rows.
cv.addEventListener('pointerdown',()=>toast.classList.add('gone'));

// Start in touch mode on phones and tablets, and switch over whenever someone touches the screen.
setTouch(matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(hover:hover)').matches));
addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') setTouch(true); },true);

new ResizeObserver(layout).observe(stage);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ spriteKey=''; layout(); });

/* ---------- Boot ---------- */
updatePlayerHud();
load(0);
state='menu';
showMenu();
requestAnimationFrame(frame);
})();
</script>
